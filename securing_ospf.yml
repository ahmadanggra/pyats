---
- name: securing_ospf
  hosts: core_switch
  gather_facts: false
  tasks:
    # - name: Verify ospf neighbors
    #   ansible.utils.cli_parse:
    #     command: show ip ospf neighbor
    #     parser:
    #       name: ansible.netcommon.pyats
    #   register: ospf_neighbors
    # - name: Display OSPF neighbors
    #   debug:
    #     var: ospf_neighbors
    - name: Configure OSPF authentication
      cisco.ios.ios_config:
        lines:
          - ip ospf authentication message-digest
          - ip ospf message-digest-key 1 md5 {{ ospf.interfaces[0].authentication.key_chain }}
        parents: "interface {{ ospf.interfaces[0].name }}"
        save_when: modified