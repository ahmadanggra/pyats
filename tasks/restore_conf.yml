---
- name: Register backup file status
  ansible.builtin.stat:
    path: "{{ backup_file }}"
  register: backup_status
  delegate_to: localhost
- name: Check if backup file exists
  ansible.builtin.assert:
    that:
      - backup_status.stat.exists
    fail_msg: "Fail:{{ inventory_hostname }} not found at {{ backup_file }}"
    success_msg: "Backup file found. Continuing restore process..."
- name: Restore configuration from backup file
  cisco.ios.ios_config:
    src: "{{ backup_file }}"
    replace: "block"
- name: Save configuration
  cisco.ios.ios_command:
    commands:
      - write memory
- name: Deleting backup file after restore
  ansible.builtin.file:
    path: "{{ backup_file }}"
    state: absent
